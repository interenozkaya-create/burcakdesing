<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Burçak Design - Yönetim Paneli</title>
    <!-- Firebase SDK (v9 Compat) -->
    <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-auth-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-firestore-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-storage-compat.js"></script>
    
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --primary: #cda45e;
            --dark: #121212;
            --darker: #0a0a0a;
            --text: #ffffff;
            --text-muted: #888888;
        }
        body {
            margin: 0;
            padding: 0;
            font-family: 'Inter', sans-serif;
            background-color: var(--darker);
            color: var(--text);
            display: flex;
            height: 100vh;
        }

        /* LOGIN SCREEN */
        #login-screen {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            width: 100%;
            height: 100vh;
            background: var(--darker);
            position: absolute;
            z-index: 999;
        }
        .login-box {
            background: #1a1a1a;
            padding: 40px;
            border-radius: 8px;
            box-shadow: 0 4px 20px rgba(0,0,0,0.5);
            width: 100%;
            max-width: 400px;
            text-align: center;
        }
        .login-box h2 {
            margin-top: 0;
            color: var(--primary);
        }
        .form-group {
            margin-bottom: 20px;
            text-align: left;
        }
        .form-group label {
            display: block;
            margin-bottom: 8px;
            color: var(--text-muted);
            font-size: 14px;
        }
        .form-group input {
            width: 100%;
            padding: 12px;
            background: var(--dark);
            border: 1px solid #333;
            color: #fff;
            border-radius: 4px;
            box-sizing: border-box;
            outline: none;
        }
        .form-group input:focus {
            border-color: var(--primary);
        }
        .btn {
            background: var(--primary);
            color: #000;
            border: none;
            padding: 12px 24px;
            border-radius: 4px;
            cursor: pointer;
            font-weight: 600;
            width: 100%;
            transition: all 0.3s;
        }
        .btn:hover {
            background: #b58d4a;
        }
        .error-msg {
            color: #ff4444;
            margin-top: 10px;
            font-size: 14px;
            display: none;
        }

        /* ADMIN LAYOUT */
        #admin-panel {
            display: none; /* Hidden until logged in */
            width: 100%;
            height: 100vh;
        }
        .sidebar {
            width: 250px;
            background: #1a1a1a;
            padding: 30px 0;
            border-right: 1px solid #333;
        }
        .sidebar-logo {
            text-align: center;
            margin-bottom: 40px;
        }
        .sidebar-logo h2 {
            margin: 0;
            color: var(--primary);
            font-size: 20px;
        }
        .nav-menu {
            list-style: none;
            padding: 0;
            margin: 0;
        }
        .nav-menu li {
            padding: 15px 30px;
            cursor: pointer;
            border-left: 3px solid transparent;
            transition: all 0.3s;
            color: var(--text-muted);
        }
        .nav-menu li:hover {
            color: #fff;
            background: rgba(255,255,255,0.05);
        }
        .nav-menu li.active {
            color: var(--primary);
            border-left-color: var(--primary);
            background: rgba(205, 164, 94, 0.1);
        }
        .logout-btn {
            margin-top: auto;
            position: absolute;
            bottom: 30px;
            left: 30px;
            color: #ff4444;
            cursor: pointer;
            background: none;
            border: none;
            font-size: 16px;
        }

        .main-content {
            flex: 1;
            padding: 40px;
            overflow-y: auto;
        }
        
        .header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 40px;
            padding-bottom: 20px;
            border-bottom: 1px solid #333;
        }

        /* DRAG AND DROP AREA */
        .upload-area {
            border: 2px dashed #333;
            border-radius: 8px;
            padding: 40px;
            text-align: center;
            background: #1a1a1a;
            transition: all 0.3s;
            cursor: pointer;
            margin-bottom: 20px;
        }
        .upload-area.dragover {
            border-color: var(--primary);
            background: rgba(205, 164, 94, 0.05);
        }
        .upload-icon {
            font-size: 40px;
            color: var(--text-muted);
            margin-bottom: 15px;
        }
        #file-input {
            display: none;
        }
        
        /* PROJECT LIST */
        .project-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(250px, 1fr));
            gap: 20px;
            margin-top: 30px;
        }
        .project-card {
            background: #1a1a1a;
            border-radius: 8px;
            overflow: hidden;
            border: 1px solid #333;
            position: relative;
        }
        .project-card img {
            width: 100%;
            height: 180px;
            object-fit: cover;
        }
        .project-info {
            padding: 15px;
        }
        .project-title {
            margin: 0 0 5px 0;
            font-size: 16px;
        }
        .project-category {
            color: var(--primary);
            font-size: 13px;
            margin: 0;
        }
        .delete-btn {
            position: absolute;
            top: 10px;
            right: 10px;
            background: rgba(255, 0, 0, 0.8);
            color: white;
            border: none;
            border-radius: 4px;
            padding: 5px 10px;
            cursor: pointer;
            font-size: 12px;
        }
        .delete-btn:hover {
            background: red;
        }

        /* NEW PROJECT FORM */
        .add-project-form {
            background: #1a1a1a;
            padding: 20px;
            border-radius: 8px;
            margin-bottom: 40px;
            border: 1px solid #333;
        }
        .row {
            display: flex;
            gap: 20px;
            margin-bottom: 20px;
        }
        .col {
            flex: 1;
        }
        .form-control {
            width: 100%;
            padding: 12px;
            background: var(--darker);
            border: 1px solid #333;
            color: #fff;
            border-radius: 4px;
            box-sizing: border-box;
        }
        .form-control:focus {
            outline: none;
            border-color: var(--primary);
        }
        #upload-progress {
            height: 4px;
            background: var(--primary);
            width: 0%;
            transition: width 0.3s;
            margin-top: 10px;
            border-radius: 2px;
        }
    </style>
</head>
<body>

    <!-- LOGIN SCREEN -->
    <div id="login-screen">
        <div class="login-box">
            <h2>Yönetim Paneli</h2>
            <div class="form-group">
                <label>E-posta Adresi</label>
                <input type="email" id="email" placeholder="admin@burcakdesign.com">
            </div>
            <div class="form-group">
                <label>Şifre</label>
                <input type="password" id="password" placeholder="••••••••">
            </div>
            <button class="btn" onclick="login()">Giriş Yap</button>
            <div id="login-error" class="error-msg">Bilgiler hatalı.</div>
        </div>
    </div>

    <!-- ADMIN PANEL -->
    <div id="admin-panel">
        <div class="sidebar">
            <div class="sidebar-logo">
                <h2>BURÇAK DESIGN</h2>
                <p style="color:#888; font-size: 12px; margin-top:5px;">Admin Panel</p>
            </div>
            <ul class="nav-menu">
                <li class="active">Portfolyo Yönetimi</li>
            </ul>
            <button class="logout-btn" onclick="logout()">Çıkış Yap</button>
        </div>

        <div class="main-content">
            <div class="header">
                <h2>Portfolyo Projeleri</h2>
                <p>Buradan yeni proje ekleyebilir ve eskileri silebilirsiniz.</p>
            </div>

            <div class="add-project-form">
                <h3 style="margin-top:0;">Yeni Proje Ekle</h3>
                
                <div class="upload-area" id="drop-zone">
                    <div class="upload-icon">📷</div>
                    <p id="upload-text">Fotoğrafı buraya sürükleyin veya seçmek için tıklayın</p>
                    <input type="file" id="file-input" accept="image/*">
                    <div id="upload-progress"></div>
                </div>

                <div class="row">
                    <div class="col">
                        <label>Proje Adı</label>
                        <input type="text" id="project-title" class="form-control" placeholder="Örn: Levent Ofis Tasarımı">
                    </div>
                    <div class="col">
                        <label>Kategori</label>
                        <select id="project-category" class="form-control">
                            <option value="konut">Konut</option>
                            <option value="ofis">Ofis</option>
                            <option value="ticari">Ticari</option>
                        </select>
                    </div>
                </div>
                
                <button class="btn" id="save-btn" onclick="saveProject()" disabled>Önce Fotoğraf Yükleyin</button>
            </div>

            <h3 style="margin-top: 50px;">Mevcut Projeler</h3>
            <div class="project-grid" id="project-list">
                <!-- Projeler buraya JavaScript ile gelecek -->
                <p>Projeler yükleniyor...</p>
            </div>
        </div>
    </div>

    <script src="admin.js"></script>
</body>
</html>
